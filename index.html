<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Experience 2026 — Inscrição em Oficinas</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>Tech Experience 2026</h1>
    <p>Inscreva-se nas oficinas técnicas do evento acadêmico.</p>
  </header>

  <main class="container">
    <form id="form-inscricao" action="processar.php" method="post" novalidate>

      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required minlength="3" autocomplete="name">
        <span class="error-message" id="erro-nome" hidden></span>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">
        <span class="error-message" id="erro-email" hidden></span>
      </div>

      <div class="field">
        <label for="experiencia">Nível de experiência</label>
        <select id="experiencia" name="experiencia" required>
          <option value="">Selecione...</option>
          <option value="iniciante">Iniciante</option>
          <option value="intermediario">Intermediário</option>
          <option value="avancado">Avançado</option>
        </select>
      </div>

      <fieldset class="field">
        <legend>Turno de preferência</legend>
        <div class="options">
          <label class="option" for="turno-manha">
            <input type="radio" id="turno-manha" name="turno" value="manha" required> Manhã
          </label>
          <label class="option" for="turno-noite">
            <input type="radio" id="turno-noite" name="turno" value="noite"> Noite
          </label>
        </div>
      </fieldset>

      <fieldset class="field" id="grupo-oficinas">
        <legend>Oficinas de interesse</legend>
        <div class="options">
          <label class="option" for="of-html">
            <input type="checkbox" id="of-html" name="oficinas[]" value="html_css"> HTML &amp; CSS
          </label>
          <label class="option" for="of-js">
            <input type="checkbox" id="of-js" name="oficinas[]" value="js_dom"> JavaScript &amp; DOM
          </label>
          <label class="option" for="of-php">
            <input type="checkbox" id="of-php" name="oficinas[]" value="php_backend"> PHP Backend
          </label>
        </div>
        <span class="error-message" id="erro-oficinas" hidden></span>
      </fieldset>

      <div class="field">
        <label for="mensagem">Mensagem / Motivação</label>
        <textarea id="mensagem" name="mensagem" maxlength="200" rows="4"></textarea>
        <small id="contador" aria-live="polite">Restam 200 caracteres</small>
      </div>

      <button type="submit" class="btn">Enviar inscrição</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Tech Experience — Desenvolvimento Web</p>
  </footer>
</body>
</html>
